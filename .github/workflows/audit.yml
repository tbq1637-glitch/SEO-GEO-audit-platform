
name: SEO and GEO Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public HTTPS page URL"
        required: true
        type: string
      scope:
        description: "Scan scope"
        required: true
        type: choice
        default: landing_page
        options:
          - landing_page
          - website

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AUDIT_URL: ${{ inputs.url }}
      AUDIT_SCOPE: ${{ inputs.scope }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      
      - name: STEP 1 - Website and Business Identification
        if: ${{ false }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install "openai>=2.0,<3.0" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pydantic>=2,<3"
          python scripts/business_identification.py


      - name: Install SEO and GEO scanners
        run: |
          python -m pip install geo-optimizer-skill
          curl -fsSL -o siteone.deb https://github.com/janreges/siteone-crawler/releases/download/v2.5.1/siteone-crawler-static_2.5.1-1_amd64.deb
          echo "294add3b77f4b90c1a68c900cd2c18495f538b8212222b7433ae081e9c271181  siteone.deb" | sha256sum -c -
          sudo dpkg -i siteone.deb

      - name: Step 1 - SEO scan using SiteOne
        run: |
          mkdir -p reports
          if [[ "$AUDIT_SCOPE" == "landing_page" ]]; then
            EXTRA=(--single-page)
          else
            EXTRA=(--max-visited-urls=25)
          fi

          siteone-crawler --url="$AUDIT_URL" "${EXTRA[@]}" \
            --workers=2 --max-reqs-per-sec=2 \
            --output-json-file=reports/seo.json \
            --output-html-report=reports/seo.html \
            --output-text-file=reports/seo.txt \
            --markdown-export-dir=reports/page_export \
            --markdown-export-single-file=reports/siteone_page.md \
            > reports/siteone.log 2>&1

      - name: Verify crawl completeness
        if: always()
        run: |
          python scripts/crawl_completeness_audit.py

      - name: Step 2 - GEO scan using GEO Optimizer
        run: |
          geo audit --url "$AUDIT_URL" --format json > reports/geo.json

      - name: Step 3 - Create combined source-labelled report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          folder = Path("reports")
          seo = json.loads((folder / "seo.json").read_text(encoding="utf-8"))
          geo = json.loads((folder / "geo.json").read_text(encoding="utf-8"))

          def clean(value):
              return " ".join(str(value).split())

          seo_items = [
              item for item in seo.get("summary", {}).get("items", [])
              if item.get("status") in ("CRITICAL", "WARNING", "INFO")
          ]
          geo_items = geo.get("recommendations", [])

          seo_score = seo.get("qualityScores", {}).get("overall", {}).get("score", "N/A")
          geo_score = geo.get("score", "N/A")

          lines = [
              "# SEO + GEO Combined Audit",
              "",
              f"Target: {clean(os.environ['AUDIT_URL'])}",
              f"Scope: {clean(os.environ['AUDIT_SCOPE'])}",
              f"Date: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              "",
              f"SiteOne overall quality score: {seo_score}/10",
              f"GEO readiness score: {geo_score}/100",
              "",
              "## SEO Findings - SiteOne Crawler",
              ""
          ]

          for index, item in enumerate(seo_items, 1):
              lines.append(
                  f"{index}. [{clean(item['status'])}] "
                  f"{clean(item.get('text', ''))} "
                  "- Source: SiteOne Crawler"
              )

          if not seo_items:
              lines.append("No SEO warning or critical findings returned.")

          lines.extend(["", "## GEO Recommendations - GEO Optimizer", ""])

          for index, item in enumerate(geo_items, 1):
              lines.append(
                  f"{index}. {clean(item)} "
                  "- Source: GEO Optimizer"
              )

          if not geo_items:
              lines.append("No GEO recommendations returned.")

          lines.extend([
              "",
              "## Review Status",
              "",
              "Both scanners are included in this report.",
              "Every finding retains its source.",
              "Semantic deduplication and AI deep review are not yet enabled.",
              "All website modifications require human approval."
          ])

          report = "\n".join(lines) + "\n"
          (folder / "SEO_GEO_AUDIT.md").write_text(
              report, encoding="utf-8"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(report)
          PY

      - name: Save original and combined reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-geo-audit-${{ github.run_number }}
          path: reports/
          retention-days: 30
