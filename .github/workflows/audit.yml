
name: SEO and GEO Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public HTTPS page URL"
        required: true
        type: string
      scope:
        description: "Scan scope"
        required: true
        type: choice
        default: landing_page
        options:
          - landing_page
          - website

permissions:
  contents: read
  actions: read

# Serialize tests using the same batch ID to reduce accidental duplicate searches.
concurrency:
  group: seo-geo-${{ github.ref }}-${{ inputs.url }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AUDIT_URL: ${{ inputs.url }}
      AUDIT_SCOPE: ${{ inputs.scope }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SEO and GEO scanners
        run: |
          python -m pip install geo-optimizer-skill
          curl -fsSL -o siteone.deb https://github.com/janreges/siteone-crawler/releases/download/v2.5.1/siteone-crawler-static_2.5.1-1_amd64.deb
          echo "294add3b77f4b90c1a68c900cd2c18495f538b8212222b7433ae081e9c271181  siteone.deb" | sha256sum -c -
          sudo dpkg -i siteone.deb

      - name: STEP 1 - Website and Business Identification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install "openai>=2.0,<3.0" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pydantic>=2,<3"
          python scripts/business_identification.py

      - name: Step 1 - SEO scan using SiteOne
        run: |
          mkdir -p reports
          if [[ "$AUDIT_SCOPE" == "landing_page" ]]; then
            EXTRA=(--single-page)
          else
            EXTRA=(--max-visited-urls=25)
          fi

          siteone-crawler --url="$AUDIT_URL" "${EXTRA[@]}" \
            --workers=2 --max-reqs-per-sec=2 \
            --output-json-file=reports/seo.json \
            --output-html-report=reports/seo.html \
            --output-text-file=reports/seo.txt \
            --markdown-export-dir=reports/page_export \
            --markdown-export-single-file=reports/siteone_page.md \
            > reports/siteone.log 2>&1

      - name: Verify crawl completeness
        if: always()
        run: |
          python scripts/crawl_completeness_audit.py

      - name: Step 2 - GEO scan using GEO Optimizer
        run: |
          geo audit --url "$AUDIT_URL" --format json > reports/geo.json

      - name: STEP 4 - Upstream SiteOne AI SEO (single page)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
          mkdir -p reports/step4/siteone_ai_cache
          siteone-crawler --help > reports/step4/siteone_ai_help.txt 2>&1 || true
          for flag in --ai-provider --ai-model --ai-actions --ai-max-pages --ai-cache-dir; do
            grep -q -- "$flag" reports/step4/siteone_ai_help.txt || { echo "Unsupported SiteOne flag: $flag"; exit 1; }
          done
          siteone-crawler --url="$AUDIT_URL" --single-page \
            --workers=1 --max-reqs-per-sec=1 \
            --ai-provider=openai --ai-model=gpt-5-mini --ai-actions=seo \
            --ai-max-pages=1 --ai-cache-dir=reports/step4/siteone_ai_cache \
            --output-json-file=reports/step4/siteone_ai_seo.json \
            --output-html-report=reports/step4/siteone_ai_seo.html \
            > reports/step4/siteone_ai_seo.log 2>&1

      - name: STEP 4 - Upstream GEO perception and fix preview
        run: |
          mkdir -p reports/step4
          geo perception --help > reports/step4/geo_perception_help.txt 2>&1 || true
          geo fix --help > reports/step4/geo_fix_help.txt 2>&1 || true
          grep -q -- "--url" reports/step4/geo_perception_help.txt || { echo "GEO perception URL flag unavailable"; exit 1; }
          grep -q -- "--url" reports/step4/geo_fix_help.txt || { echo "GEO fix URL flag unavailable"; exit 1; }
          geo perception --url "$AUDIT_URL" > reports/step4/geo_perception.txt 2>&1
          geo fix --url "$AUDIT_URL" > reports/step4/geo_fix_preview.txt 2>&1

      - name: STEP 2-3 - Offline safety tests (zero API requests)
        run: |
          python -m pip install "pytest>=8,<10" "pydantic>=2,<3" "requests>=2.31,<3"
          python -m pytest -q tests/test_search_research.py tests/test_competitor_evidence.py tests/test_video_evidence.py tests/test_five_query_pipeline.py tests/test_structured_capture.py

      - name: Compute research cache key from target evidence
        id: research_cache_key
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          evidence = Path("reports/siteone_page.md").read_bytes()
          key = hashlib.sha256(b"auto-five-v2|" + evidence).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("digest=" + key + "\n")
          PY

      - name: Restore prior five-query research
        id: research_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/search_intents.json
            reports/google_serp.json
          key: auto-five-v2-research-${{ steps.research_cache_key.outputs.digest }}

      - name: STEP 2-3 - Seven candidate intents and five Google searches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SEARCH_BATCH_ID: auto-five-v2
        run: python scripts/auto_four_searches.py

      - name: Save five-query research cache
        if: ${{ steps.research_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            reports/search_intents.json
            reports/google_serp.json
          key: auto-five-v2-research-${{ steps.research_cache_key.outputs.digest }}

      - name: STEP 3 - Capture competitor page evidence
        run: |
          python scripts/competitor_evidence.py

      - name: STEP 3 - Inspect original HTML structure and dynamic signals
        id: structure_audit
        run: python scripts/structured_capture.py assess

      - name: STEP 3 - Recover rendered DOM when static extraction is incomplete
        if: ${{ steps.structure_audit.outputs.browser_needed == 'true' }}
        run: python scripts/structured_capture.py recover

      - name: STEP 3 - Extract video context and conditional publisher text tracks
        run: python scripts/video_evidence.py

      - name: STEP 4 - GEO native access and website structure diagnostics
        run: python scripts/geo_extended_diagnostics.py

      - name: STEP 4 - Selective visual layout evidence (SiteOne + image AI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install "Pillow>=10,<12"
          python scripts/visual_evidence.py

      - name: Integrated evidence-based fusion report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fusion_report.py

      - name: Render human-readable integrated HTML
        run: |
          python -m pip install "Markdown>=3.6,<4" "beautifulsoup4>=4.12,<5"
          python scripts/render_combined_report.py

      - name: Step 3 - Create combined source-labelled report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          folder = Path("reports")
          seo = json.loads((folder / "seo.json").read_text(encoding="utf-8"))
          geo = json.loads((folder / "geo.json").read_text(encoding="utf-8"))

          def clean(value):
              return " ".join(str(value).split())

          seo_items = [
              item for item in seo.get("summary", {}).get("items", [])
              if item.get("status") in ("CRITICAL", "WARNING", "INFO")
          ]
          geo_items = geo.get("recommendations", [])

          seo_score = seo.get("qualityScores", {}).get("overall", {}).get("score", "N/A")
          geo_score = geo.get("score", "N/A")

          lines = [
              "# SEO + GEO Combined Audit",
              "",
              f"Target: {clean(os.environ['AUDIT_URL'])}",
              f"Scope: {clean(os.environ['AUDIT_SCOPE'])}",
              f"Date: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              "",
              f"SiteOne overall quality score: {seo_score}/10",
              f"GEO readiness score: {geo_score}/100",
              "",
              "## SEO Findings - SiteOne Crawler",
              ""
          ]

          for index, item in enumerate(seo_items, 1):
              lines.append(
                  f"{index}. [{clean(item['status'])}] "
                  f"{clean(item.get('text', ''))} "
                  "- Source: SiteOne Crawler"
              )

          if not seo_items:
              lines.append("No SEO warning or critical findings returned.")

          lines.extend(["", "## GEO Recommendations - GEO Optimizer", ""])

          for index, item in enumerate(geo_items, 1):
              lines.append(
                  f"{index}. {clean(item)} "
                  "- Source: GEO Optimizer"
              )

          if not geo_items:
              lines.append("No GEO recommendations returned.")

          lines.extend([
              "",
              "## Review Status",
              "",
              "Both scanners are included in this report.",
              "Every finding retains its source.",
              "Semantic deduplication and AI deep review are not yet enabled.",
              "All website modifications require human approval."
          ])

          report = "\n".join(lines) + "\n"
          (folder / "SEO_GEO_AUDIT.md").write_text(
              report, encoding="utf-8"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(report)
          PY

      - name: Save original and combined reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-geo-audit-${{ github.run_number }}
          path: reports/
          retention-days: 30
