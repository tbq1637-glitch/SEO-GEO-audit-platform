name: STEP 3 Capture Diagnostic (No Paid APIs)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing Google search evidence
        uses: actions/cache/restore@v4
        with:
          path: reports/google_serp.json
          key: v2-serp-snapshot-15175101bdc91e9dba4530476012ce97a25647308b737655c0a794145ba2230d
      - name: Verify cached search evidence without calling an API
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/google_serp.json")
          if not p.is_file():
              raise SystemExit("Cached Run 12 SERP snapshot unavailable. Stopping without paid API calls.")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("batch_id") != "stage3-pilot-v1" or len(data.get("groups", [])) != 2:
              raise SystemExit("Unexpected SERP evidence; stopping.")
          print("Existing Google evidence restored. New Google/OpenAI API requests: 0.")
          PY
      - name: Install free capture tools
        run: |
          python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pytest>=8,<10"
          curl -fsSL -o siteone.deb https://github.com/janreges/siteone-crawler/releases/download/v2.5.1/siteone-crawler-static_2.5.1-1_amd64.deb
          echo "294add3b77f4b90c1a68c900cd2c18495f538b8212222b7433ae081e9c271181  siteone.deb" | sha256sum -c -
          sudo dpkg -i siteone.deb
      - name: Offline capture safety tests
        run: python -m pytest -q tests/test_competitor_evidence.py
      - name: Capture competitor content without paid APIs
        run: python scripts/competitor_evidence.py
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-free-competitor-evidence
          path: |
            reports/competitor_evidence.json
            reports/COMPETITOR_EVIDENCE.md
            reports/competitor_*.md
            reports/competitor_*_conversion.log
          retention-days: 7
