name: STEP 3 Capture Evidence (Open Source)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing Google search evidence
        uses: actions/cache/restore@v4
        with:
          path: reports/google_serp.json
          key: v2-serp-snapshot-15175101bdc91e9dba4530476012ce97a25647308b737655c0a794145ba2230d
      - name: Verify existing search evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/google_serp.json")
          if not p.is_file():
              raise SystemExit("Cached Google evidence unavailable. No API requests made.")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("batch_id") != "stage3-pilot-v1" or len(data.get("groups", [])) != 2:
              raise SystemExit("Unexpected cached snapshot. No API requests made.")
          print("Verified existing Google evidence. No paid API requests.")
          PY
      - name: Install SiteOne and capture dependencies
        run: |
          python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pytest>=8,<10"
          curl -fsSL -o siteone.deb https://github.com/janreges/siteone-crawler/releases/download/v2.5.1/siteone-crawler-static_2.5.1-1_amd64.deb
          echo "294add3b77f4b90c1a68c900cd2c18495f538b8212222b7433ae081e9c271181  siteone.deb" | sha256sum -c -
          sudo dpkg -i siteone.deb
      - name: Inspect installed upstream capabilities without API calls
        run: |
          mkdir -p reports/upstream_capabilities
          python -m pip install "geo-optimizer-skill[mcp]"
          siteone-crawler --version > reports/upstream_capabilities/siteone_version.txt 2>&1 || true
          siteone-crawler --help > reports/upstream_capabilities/siteone_help.txt 2>&1 || true
          geo --help > reports/upstream_capabilities/geo_help.txt 2>&1 || true
          geo citations --help > reports/upstream_capabilities/geo_citations_help.txt 2>&1 || true
          geo authority --help > reports/upstream_capabilities/geo_authority_help.txt 2>&1 || true
          python -m pip show geo-optimizer-skill > reports/upstream_capabilities/geo_package.txt 2>&1
          python - <<'PY'
          from pathlib import Path
          p = Path("reports/upstream_capabilities")
          help_text = (p / "siteone_help.txt").read_text(errors="replace")
          for flag in ("--ai-provider", "--ai-model", "--ai-actions", "--ai-dry-run",
                       "--ai-max-pages", "--ai-prompt"):
              print(f"SiteOne {flag}: {'present' if flag in help_text else 'not confirmed'}")
          for name in ("geo_help", "geo_citations_help", "geo_authority_help"):
              print(name, "captured", (p / (name+".txt")).stat().st_size, "bytes")
          PY
      - name: STEP 4 upstream compatibility preflight (zero AI/API calls)
        run: |
          mkdir -p reports/step4_preflight
          python -m pip install "geo-optimizer-skill"
          siteone-crawler --help > reports/step4_preflight/siteone_help.txt 2>&1
          geo perception --help > reports/step4_preflight/perception_help.txt 2>&1
          geo fix --help > reports/step4_preflight/fix_help.txt 2>&1
          python - <<'PY'
          from pathlib import Path
          root = Path("reports/step4_preflight")
          s = (root/"siteone_help.txt").read_text()
          p = (root/"perception_help.txt").read_text()
          f = (root/"fix_help.txt").read_text()
          checks = {
              "siteone_ai_provider": "--ai-provider" in s,
              "siteone_ai_model": "--ai-model" in s,
              "siteone_ai_actions": "--ai-actions" in s,
              "siteone_ai_cache": "--ai-cache-dir" in s,
              "siteone_ai_pages": "--ai-max-pages" in s,
              "geo_perception_url": "--url" in p,
              "geo_fix_url": "--url" in f,
          }
          (root/"STEP4_PREFLIGHT.txt").write_text(
              "\\n".join(f"{k}: {'SUPPORTED' if v else 'NOT_CONFIRMED'}" for k,v in checks.items())+"\\n"
          )
          print((root/"STEP4_PREFLIGHT.txt").read_text())
          if not all(checks.values()):
              raise SystemExit("STEP 4 flags require correction before enabling paid analysis")
          PY
      - name: Offline capture checks
        run: python -m pytest -q tests/test_competitor_evidence.py
      - name: Capture public competitor evidence with SiteOne
        run: python scripts/competitor_evidence.py
      - name: Upload original page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-open-source-competitor-evidence
          path: |
            reports/upstream_capabilities/
            reports/step4_preflight/
            reports/competitor_evidence.json
            reports/COMPETITOR_EVIDENCE.md
            reports/competitor_*.md
            reports/competitor_*_conversion.log
          retention-days: 7
