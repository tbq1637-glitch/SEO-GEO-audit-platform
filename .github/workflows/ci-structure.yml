name: Offline Structure Integration Tests

on:
  push:
    branches:
      - v3-upstream-coverage
      - v2-search-competitiveness
    paths:
      - 'scripts/structured_capture.py'
      - 'scripts/competitor_evidence.py'
      - 'scripts/crawl_completeness_audit.py'
      - 'scripts/business_identification.py'
      - 'scripts/fusion_report.py'
      - 'scripts/geo_extended_diagnostics.py'
      - 'scripts/visual_evidence.py'
      - 'scripts/fusion_api.py'
      - 'scripts/validate_fusion_replay.py'
      - '.github/workflows/audit.yml'
      - 'scripts/video_evidence.py'
      - 'tests/**'
      - '.github/workflows/ci-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local parsing and test dependencies
        run: python -m pip install "pytest>=8,<10" "beautifulsoup4>=4.12,<5" "requests>=2.31,<3" "pydantic>=2,<3" "openai>=2,<3" "Pillow>=10,<12"
      - name: Static syntax validation
        run: python -m compileall -q scripts tests
      - name: Offline functional tests
        run: python -m pytest -q tests/test_competitor_evidence.py tests/test_five_query_pipeline.py tests/test_structured_capture.py tests/test_search_research.py tests/test_visual_evidence.py tests/test_fusion_replay.py
